name: Generate Release Docs

on:
  workflow_dispatch:
    inputs:
      tag1:
        description: "Previous tag (e.g. v2.0.0)"
        required: true
        type: string
      tag2:
        description: "New tag (e.g. v2.0.1)"
        required: true
        type: string
      template_path:
        description: "Path to the .docx release template"
        required: false
        type: string
        default: "docs/releases/release_template.docx"
      output_basename:
        description: "Output filename without extension"
        required: false
        type: string
        default: ""  # defaults to docs/releases/release_<tag2> if left blank

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repo (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests python-docx

      - name: Resolve output path
        id: vars
        run: |
          if [ -n "${{ inputs.output_basename }}" ]; then
            BASE="${{ inputs.output_basename }}"
          else
            BASE="docs/releases/release_${{ inputs.tag2 }}"
          fi
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Generate release docs (.docx from template + .md)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p "$(dirname '${{ steps.vars.outputs.base }}')"
          python scripts/generate_release_docs.py \
            --owner "${{ github.repository_owner }}" \
            --repo "${{ github.event.repository.name }}" \
            --tag1 "${{ inputs.tag1 }}" \
            --tag2 "${{ inputs.tag2 }}" \
            --template "${{ inputs.template_path }}" \
            --output "${{ steps.vars.outputs.base }}"

      - name: Upload as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-doc-${{ inputs.tag2 }}
          path: |
            ${{ steps.vars.outputs.base }}.docx
            ${{ steps.vars.outputs.base }}.md

      - name: Open PR with generated docs
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "docs: add release notes for ${{ inputs.tag2 }}"
          branch: release-docs/${{ inputs.tag2 }}
          title: "Release docs: ${{ inputs.tag1 }} -> ${{ inputs.tag2 }}"
          body: |
            Auto-generated release notes comparing `${{ inputs.tag1 }}` to `${{ inputs.tag2 }}`,
            filled into the standard release template.
            Please review before merging — the AI drafts based on commit messages and diffs,
            but details should be double-checked.
          add-paths: |
            ${{ steps.vars.outputs.base }}.docx
            ${{ steps.vars.outputs.base }}.md

